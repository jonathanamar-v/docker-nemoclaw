services:
  app:
    container_name: "application-server"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/workspace:cached
      # Mount host Docker socket into the container
      - /var/run/docker.sock:/var/run/docker.sock
      # Map host group file for Docker GID matching
      - /etc/group:/etc/host-group
      # Mount host Docker config for registry auth
      - /etc/docker:/root/.docker
    ports:
      - "8080:8080"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true
